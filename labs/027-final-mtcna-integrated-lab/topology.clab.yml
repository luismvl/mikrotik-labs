name: 027-final-mtcna-integrated-lab

mgmt:
  network: mikrotik-labs-mgmt
  ipv4-subnet: auto
  ipv6-subnet: auto

topology:
  nodes:
    r1:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.16
      startup-config: startup/r1.rsc
      ports:
        - 43291:8291
        - 43221:22
        - 43281:80
    r2:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.16
      startup-config: startup/r2.rsc
      ports:
        - 43292:8291
        - 43222:22
        - 43282:80
    client:
      kind: linux
      image: alpine:latest
  links:
    - endpoints: ["r1:ether2", "r2:ether2"]
    - endpoints: ["r2:ether3", "client:eth1"]
