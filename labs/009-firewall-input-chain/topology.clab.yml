name: 009-firewall-input-chain

mgmt:
  network: mikrotik-labs-mgmt
  ipv4-subnet: auto
  ipv6-subnet: auto

topology:
  nodes:
    r1:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.16
      startup-config: startup/r1.rsc
      ports:
        - 43291:8291
        - 43221:22
        - 43281:80
    client:
      kind: linux
      image: alpine:latest
  links:
    - endpoints: ["r1:ether2", "client:eth1"]
