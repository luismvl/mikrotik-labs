name: 017-ppp-pppoe-basics

topology:
  nodes:
    r1:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.16
      startup-config: startup/r1.rsc
      ports:
        - 18001:8291
        - 12001:22
        - 8081:80
    r2:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.16
      startup-config: startup/r2.rsc
      ports:
        - 18002:8291
        - 12002:22
        - 8082:80
  links:
    - endpoints: ["r1:ether2", "r2:ether2"]
