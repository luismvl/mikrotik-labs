name: 013-bridge-basics

mgmt:
  network: mikrotik-labs-mgmt
  ipv4-subnet: auto
  ipv6-subnet: auto

topology:
  nodes:
    r1:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.16
      startup-config: startup/r1.rsc
      ports:
        - 43291:8291
        - 43221:22
        - 43281:80
    client1:
      kind: linux
      image: alpine:latest
    client2:
      kind: linux
      image: alpine:latest
  links:
    - endpoints: ["r1:ether2", "client1:eth1"]
    - endpoints: ["r1:ether3", "client2:eth1"]
